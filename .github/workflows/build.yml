name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # استخدم 3.12 لضمان الاستقرار، أو 3.14 إذا أردت
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: midad-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
